<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Academy - Beginners</title>
<style>
*{box-sizing:border-box} :root{--bg1:#11202b;--bg2:#174b5c;--accent:#38bdf8;--accent2:#22c55e;--panel:#eaf6f7;--ink:#15313b;--menu:#153744;--menu2:#1f5566;--active:#0ea5e9;--term:#03120c;--green:#8dffb0;--soft:#c7ffd5;--dim:#62c77c;--warn:#ffe082;--danger:#ff7a7a;--safe:#84f3b0}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,#1f7a8c 0,#11202b 45%,#0b1118 100%);font-family:Arial,Helvetica,sans-serif;color:var(--ink);padding:20px}.app{width:1000px;height:500px;border-radius:24px;overflow:hidden;display:grid;grid-template-rows:82px 1fr;box-shadow:0 24px 65px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.14)}.topbar{background:linear-gradient(135deg,#10212c,#145066 58%,#22c55e);color:white;padding:13px 18px;display:grid;grid-template-columns:1.45fr .8fr;gap:18px;align-items:center}.title h1{margin:0 0 5px;font-size:29px;line-height:1}.title p{margin:0;font-size:13px;line-height:1.3;max-width:620px;color:rgba(255,255,255,.95)}.control-row{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center}.control-row label{font-weight:bold;font-size:14px}select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.96);font-size:14px;font-weight:bold;color:#12323d}.content{display:grid;grid-template-columns:242px 1fr;overflow:hidden;background:linear-gradient(180deg,#edf8f8,#d9ebee)}.sidebar{padding:11px 10px;background:linear-gradient(180deg,#e5f4f6,#cfe3e8);border-right:1px solid rgba(0,0,0,.12);display:flex;flex-direction:column;min-height:0}.sidebar h2{font-size:18px;margin:0 0 6px;color:#13323b}.sidebar p{font-size:12px;margin:0 0 8px;line-height:1.25;color:#365760}.menu-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}.menu-btn{width:100%;border:0;border-radius:10px;background:var(--menu);color:white;text-align:left;padding:8px 10px;font-size:13px;line-height:1.16;cursor:pointer;box-shadow:0 3px 9px rgba(0,0,0,.12)}.menu-btn span{font-size:11px;opacity:.88}.menu-btn:hover{background:var(--menu2)}.menu-btn.active{background:var(--active);font-weight:bold}.terminal-wrap{padding:13px;min-height:0}.terminal-frame{height:100%;border-radius:18px;background:#06130d;border:8px solid #123225;box-shadow:inset 0 0 25px rgba(34,197,94,.08),0 12px 20px rgba(0,0,0,.2);overflow:hidden;position:relative}.terminal-frame:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 2px,transparent 2px,transparent 4px);pointer-events:none;opacity:.3}.terminal-header{position:relative;z-index:1;height:36px;padding:9px 14px;border-bottom:1px solid rgba(141,255,176,.22);display:flex;justify-content:space-between;color:var(--soft);font-family:"Courier New",Consolas,monospace;font-size:13px}.terminal-screen{position:relative;z-index:1;height:calc(100% - 36px);overflow:auto;padding:12px 16px 16px;color:var(--green);font-family:"Courier New",Consolas,monospace}.prompt{color:var(--soft);font-weight:bold;margin-bottom:7px}.heading{font-size:20px;margin:0 0 8px;color:var(--soft);text-transform:uppercase;letter-spacing:1px}.tagbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}.tag{border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:12px}.safe{color:var(--safe)}.warn{color:var(--warn)}.danger{color:var(--danger)}.level{color:#89d9ff}.section{margin-bottom:10px;font-size:14px;line-height:1.38}.label{display:block;color:var(--dim);font-weight:bold;text-transform:uppercase;letter-spacing:.5px;font-size:12px;margin-bottom:3px}.codeblock{background:rgba(141,255,176,.07);border:1px solid rgba(141,255,176,.18);border-radius:9px;padding:8px 10px;white-space:pre-wrap;color:var(--soft);margin-top:4px}.mini{font-size:12px;color:var(--dim)}@media(max-width:1050px){body{padding:0}.app{width:100vw;height:100vh;border-radius:0}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title"><h1>Linux Academy</h1><p>Linux-terminal voor echte beginners. Kies een hoofdrubriek, klik links op een commando en lees rechts wat het doet, wanneer je het gebruikt en waar je voor moet oppassen.</p></div>
    <div class="control-row"><label for="categorySelect">Hoofdrubriek</label><select id="categorySelect"></select></div>
  </div>
  <div class="content">
    <aside class="sidebar"><h2 id="sidebarTitle">Commando's</h2><p id="sidebarIntro">Kies bovenin een rubriek.</p><ul class="menu-list" id="commandList"></ul></aside>
    <main class="terminal-wrap"><div class="terminal-frame"><div class="terminal-header"><span>student@linux:~$</span><span id="terminalCategory">BEGINNER</span></div><div class="terminal-screen" id="terminalContent"></div></div></main>
  </div>
</div>
<script>
const data={
"Starten met Linux":{intro:"Eerste veilige commando's om te kijken waar je bent en wie je bent.",items:[
{title:"pwd",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Laat zien in welke map je nu staat.",when:"Gebruik dit als je verdwaald bent in de terminal.",example:"pwd",output:"/home/student",task:"Open de terminal en zoek met pwd uit waar je begint.",tip:"PWD betekent print working directory: toon de huidige werkmap."},
{title:"ls",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Toont bestanden en mappen in de huidige map.",when:"Gebruik dit zoals dir in Windows CMD.",example:"ls\nls -l\nls -a",output:"Documenten  Downloads  Afbeeldingen\n.bashrc  .profile",task:"Bekijk je thuismap met ls en daarna met ls -a.",tip:"Bestanden die beginnen met een punt zijn verborgen bestanden."},
{title:"cd",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Gaat naar een andere map.",when:"Gebruik dit om door mappen te bewegen.",example:"cd Documenten\ncd ..\ncd ~",output:"student@linux:~/Documenten$",task:"Ga naar Documenten, daarna een map terug, daarna naar je thuismap.",tip:"~ betekent je persoonlijke thuismap."},
{title:"clear",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Maakt het terminalscherm leeg.",when:"Handig als het scherm vol staat met uitvoer.",example:"clear",output:"[scherm wordt leeggemaakt]",task:"Voer eerst ls uit en maak daarna het scherm leeg.",tip:"Clear wist geen bestanden, alleen de tekst op je scherm."},
{title:"whoami / hostname",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Toont je gebruikersnaam en de computernaam.",when:"Gebruik dit om te controleren als wie je bent ingelogd en op welke machine je werkt.",example:"whoami\nhostname",output:"student\nlinux-laptop-04",task:"Noteer je gebruikersnaam en computernaam.",tip:"Handig bij support: eerst weten waar en als wie je werkt."}
]},
"Bestanden en mappen":{intro:"Bestanden bekijken, maken, kopiëren en verplaatsen. Let op met verwijderen.",items:[
{title:"mkdir / touch",safety:"warn",safetyLabel:"Voorzichtig",level:"Beginner",use:"Maakt een map of leeg bestand aan.",when:"Gebruik dit om oefenmappen en testbestanden te maken.",example:"mkdir oefenmap\ntouch notitie.txt",output:"[map en bestand worden aangemaakt]",task:"Maak een map linux-oefenen en daarin een bestand test.txt.",tip:"Touch maakt een leeg bestand of werkt de datum van een bestaand bestand bij."},
{title:"cp",safety:"warn",safetyLabel:"Voorzichtig",level:"Beginner",use:"Kopieert bestanden of mappen.",when:"Gebruik dit als je een reservekopie wilt maken.",example:"cp test.txt kopie.txt\ncp -r map1 map2",output:"[bestand of map wordt gekopieerd]",task:"Maak een kopie van test.txt met de naam backup.txt.",tip:"Voor mappen gebruik je meestal cp -r."},
{title:"mv",safety:"warn",safetyLabel:"Voorzichtig",level:"Beginner",use:"Verplaatst of hernoemt bestanden.",when:"Gebruik dit om een bestand een andere naam te geven of naar een andere map te zetten.",example:"mv oud.txt nieuw.txt\nmv bestand.txt Documenten/",output:"[bestand krijgt nieuwe naam of verhuist]",task:"Hernoem test.txt naar opdracht.txt.",tip:"MV kan dus twee dingen betekenen: move of rename."},
{title:"cat / less",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Laat de inhoud van tekstbestanden zien.",when:"Gebruik cat voor korte bestanden en less voor langere bestanden.",example:"cat notitie.txt\nless langbestand.txt",output:"Dit is mijn notitie.",task:"Maak een tekstbestand en bekijk het met cat.",tip:"In less sluit je af met de letter q."},
{title:"rm",safety:"danger",safetyLabel:"Gevaarlijk",level:"Beginner",use:"Verwijdert bestanden of mappen.",when:"Gebruik dit alleen als je zeker weet dat iets weg mag.",example:"rm test.txt\nrm -r oefenmap",output:"[bestand of map wordt verwijderd]",task:"Leg uit waarom rm gevaarlijker is dan ls.",tip:"Linux heeft niet altijd een prullenbak in de terminal. Weg kan echt weg zijn."}
]},
"Hulp en informatie":{intro:"Commando's om hulp te vinden en informatie over het systeem op te vragen.",items:[
{title:"man / --help",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Geeft hulp over commando's.",when:"Gebruik dit als je niet meer weet welke opties een commando heeft.",example:"man ls\nls --help",output:"LS(1) User Commands\nNAME\n  ls - list directory contents",task:"Open de handleiding van ls en sluit af met q.",tip:"Man betekent manual: handleiding."},
{title:"history",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Toont welke commando's eerder zijn gebruikt.",when:"Gebruik dit om terug te kijken wat je hebt gedaan.",example:"history",output:"1  pwd\n2  ls\n3  cd Documenten",task:"Voer drie commando's uit en bekijk daarna history.",tip:"Met pijltje omhoog kun je eerdere commando's opnieuw gebruiken."},
{title:"uname / lsb_release",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Toont informatie over Linux en de distributie.",when:"Handig als je wilt weten welke Linux-versie je gebruikt.",example:"uname -a\nlsb_release -a",output:"Ubuntu 24.04 LTS\nLinux laptop 6.x.x",task:"Zoek de Linux-versie van je systeem op.",tip:"Niet elke Linux-installatie heeft lsb_release standaard."},
{title:"date / cal",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Toont datum, tijd en kalender.",when:"Gebruik dit om snel systeemdatum en tijd te controleren.",example:"date\ncal",output:"Thu Jul 9 15:30:00 CEST 2026",task:"Controleer de datum en tijd in de terminal.",tip:"Op servers is de juiste tijd belangrijk voor logs en certificaten."}
]},
"Rechten en gebruikers":{intro:"Linux werkt veel met rechten. Voor beginners is begrijpen belangrijker dan meteen alles aanpassen.",items:[
{title:"sudo",safety:"danger",safetyLabel:"Gevaarlijk",level:"Belangrijk",use:"Voert een commando uit met beheerdersrechten.",when:"Gebruik dit alleen als je weet waarom extra rechten nodig zijn.",example:"sudo apt update",output:"[sudo] password for student:",task:"Leg uit waarom sudo gevaarlijk kan zijn bij verkeerde commando's.",tip:"Sudo is alsof je in Windows 'Als administrator uitvoeren' gebruikt."},
{title:"chmod",safety:"warn",safetyLabel:"Voorzichtig",level:"Basis+",use:"Past rechten van bestanden aan.",when:"Gebruik dit bijvoorbeeld om een script uitvoerbaar te maken.",example:"chmod +x script.sh",output:"[script mag nu uitgevoerd worden]",task:"Zoek uit wat uitvoeren betekent bij een script.",tip:"Maak niet zomaar alles uitvoerbaar. Rechten zijn beveiliging."},
{title:"chown",safety:"danger",safetyLabel:"Gevaarlijk",level:"Basis+",use:"Verandert de eigenaar van bestanden of mappen.",when:"Gebruik dit bij rechtenproblemen, maar alleen als je weet wie eigenaar moet zijn.",example:"sudo chown student bestand.txt",output:"[eigenaar wordt aangepast]",task:"Bekijk eerst met ls -l wie eigenaar is van een bestand.",tip:"Verkeerde eigenaar kan programma's laten vastlopen."},
{title:"id / groups",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Toont gebruikersnummer en groepen van de gebruiker.",when:"Gebruik dit om te zien welke rechten een gebruiker via groepen kan hebben.",example:"id\ngroups",output:"uid=1000(student) gid=1000(student) groups=1000(student),27(sudo)",task:"Controleer van welke groepen jouw gebruiker lid is.",tip:"Groepen bepalen vaak of je bijvoorbeeld sudo mag gebruiken."}
]},
"Netwerk":{intro:"Veilige netwerkcommando's om verbindingen en adressen te controleren.",items:[
{title:"ip a",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Toont netwerkkaarten en IP-adressen.",when:"Gebruik dit als je wilt weten of Linux een IP-adres heeft.",example:"ip a",output:"inet 192.168.1.34/24 brd 192.168.1.255 scope global wlan0",task:"Zoek je IPv4-adres op.",tip:"Dit is de moderne vervanger van ifconfig."},
{title:"ping",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Test of een apparaat of website bereikbaar is.",when:"Gebruik dit bij internetproblemen.",example:"ping 8.8.8.8\nping google.nl",output:"64 bytes from 8.8.8.8: icmp_seq=1 ttl=117 time=18 ms",task:"Ping eerst een IP-adres en daarna een website.",tip:"Stop ping met Ctrl + C."},
{title:"ss",safety:"safe",safetyLabel:"Veilig",level:"Basis+",use:"Toont netwerkverbindingen en luisterende poorten.",when:"Gebruik dit als je wilt weten welke services netwerkverbindingen gebruiken.",example:"ss -tuln",output:"tcp LISTEN 0 4096 0.0.0.0:22",task:"Zoek een regel met LISTEN op.",tip:"SS is de moderne vervanger van netstat."},
{title:"curl / wget",safety:"warn",safetyLabel:"Voorzichtig",level:"Basis+",use:"Haalt webpagina's of bestanden op via de terminal.",when:"Gebruik dit om te testen of een website bereikbaar is of om bestanden te downloaden.",example:"curl https://example.com\nwget https://example.com/bestand.txt",output:"<!doctype html>...",task:"Leg uit waarom je alleen bestanden van betrouwbare bronnen downloadt.",tip:"Downloaden vanaf onbekende websites kan onveilig zijn."}
]},
"Software en updates":{intro:"Voor beginners vooral Ubuntu/Debian-achtige commando's. Handig bij Raspberry Pi en veel Linux-lessen.",items:[
{title:"apt update",safety:"warn",safetyLabel:"Voorzichtig",level:"Beginner",use:"Vernieuwt de lijst met beschikbare pakketten.",when:"Gebruik dit vóór je software installeert of updates uitvoert.",example:"sudo apt update",output:"Hit:1 http://archive.ubuntu.com/ubuntu noble InRelease",task:"Leg uit waarom update nog niet hetzelfde is als upgraden.",tip:"Apt update haalt informatie op, maar installeert nog niets."},
{title:"apt install",safety:"warn",safetyLabel:"Voorzichtig",level:"Beginner",use:"Installeert softwarepakketten.",when:"Gebruik dit als je een programma nodig hebt dat nog niet aanwezig is.",example:"sudo apt install htop",output:"Do you want to continue? [Y/n]",task:"Zoek uit waarvoor htop gebruikt wordt.",tip:"Controleer altijd wat er geïnstalleerd wordt voordat je ja zegt."},
{title:"apt upgrade",safety:"warn",safetyLabel:"Voorzichtig",level:"Basis+",use:"Installeert beschikbare updates voor pakketten.",when:"Gebruik dit om een Linux-systeem bij te werken.",example:"sudo apt upgrade",output:"The following packages will be upgraded...",task:"Waarom is updaten belangrijk voor beveiliging?",tip:"Op productieservers plan je updates zorgvuldig."},
{title:"which / whereis",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Zoekt waar een programma staat.",when:"Gebruik dit als je wilt controleren of een commando geïnstalleerd is.",example:"which python3\nwhereis python3",output:"/usr/bin/python3",task:"Controleer of python3 aanwezig is.",tip:"Als which niets teruggeeft, staat het programma mogelijk niet geïnstalleerd."}
]},
"Processen en opslag":{intro:"Kijken wat draait en hoeveel ruimte of geheugen er beschikbaar is.",items:[
{title:"top / htop",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Toont actieve processen en systeemgebruik.",when:"Gebruik dit als de computer traag is.",example:"top\nhtop",output:"PID USER  PR  NI  VIRT  RES  CPU%  MEM% COMMAND",task:"Open top en sluit af met q.",tip:"Htop is gebruiksvriendelijker, maar staat niet altijd standaard geïnstalleerd."},
{title:"ps",safety:"safe",safetyLabel:"Veilig",level:"Basis+",use:"Toont processen.",when:"Gebruik dit om te zoeken of een programma draait.",example:"ps aux | grep firefox",output:"student  2541  3.2  firefox",task:"Zoek of bash actief is.",tip:"Het streepje | heet pipe: uitvoer doorgeven aan een volgend commando."},
{title:"kill",safety:"warn",safetyLabel:"Voorzichtig",level:"Basis+",use:"Stopt een proces.",when:"Gebruik dit als een programma vastloopt.",example:"kill 2541",output:"[proces wordt gestopt]",task:"Leg uit waarom je eerst het juiste PID moet weten.",tip:"Gebruik kill niet zomaar op systeemprocessen."},
{title:"df / du",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Toont schijfruimte en mapgrootte.",when:"Gebruik dit als een systeem bijna vol lijkt te zitten.",example:"df -h\ndu -sh Downloads",output:"Filesystem Size Used Avail Use% Mounted on\n/dev/sda1  50G  31G   17G  65% /",task:"Bekijk hoeveel vrije ruimte er is op het systeem.",tip:"De optie -h maakt de uitvoer beter leesbaar voor mensen."}
]},
"Mini challenge":{intro:"Korte oefenopdrachten waarmee leerlingen veilig beginnen.",items:[
{title:"Challenge brons",safety:"safe",safetyLabel:"Veilig",level:"Beginner",use:"Een korte startopdracht met veilige commando's.",when:"Gebruik dit als eerste Linux-les.",example:"pwd\nls\ncd Documenten\nwhoami\nhostname",output:"Beantwoord: waar ben ik, wat staat hier, wie ben ik, op welke computer werk ik?",task:"Maak een screenshot van de terminal met de vijf antwoorden.",tip:"Brons bevat alleen kijk- en navigatiecommando's."},
{title:"Challenge zilver",safety:"warn",safetyLabel:"Voorzichtig",level:"Basis+",use:"Leerlingen maken, kopiëren en bekijken bestanden.",when:"Gebruik dit na de basiscommando's.",example:"mkdir linux-les\ncd linux-les\ntouch opdracht.txt\ncp opdracht.txt backup.txt\nls -l",output:"opdracht.txt en backup.txt staan in de map linux-les",task:"Maak de map, het bestand en de kopie. Laat met ls -l zien dat het gelukt is.",tip:"Nog niet verwijderen; eerst laten controleren."},
{title:"Niet doen lijst",safety:"danger",safetyLabel:"Gevaarlijk",level:"Belangrijk",use:"Commando's waar beginners extra mee moeten oppassen.",when:"Bespreek dit voordat leerlingen met sudo, rm of chmod werken.",example:"rm -rf /\nsudo chmod -R 777 /\nsudo chown -R student /",output:"Deze opdrachten kunnen een systeem kapot maken.",task:"Leg uit waarom je commando's van internet nooit blind moet kopiëren.",tip:"Eerst begrijpen, dan pas uitvoeren."}
]}
};
const categorySelect=document.getElementById('categorySelect'),commandList=document.getElementById('commandList'),terminalContent=document.getElementById('terminalContent'),terminalCategory=document.getElementById('terminalCategory'),sidebarTitle=document.getElementById('sidebarTitle'),sidebarIntro=document.getElementById('sidebarIntro');
Object.keys(data).forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;categorySelect.appendChild(o)});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderTerminal(item,cat){terminalCategory.textContent=cat.toUpperCase();terminalContent.innerHTML=`<div class="prompt">student@linux:~$ help ${esc(item.title)}</div><h2 class="heading">${esc(item.title)}</h2><div class="tagbar"><span class="tag ${item.safety}">${esc(item.safetyLabel)}</span><span class="tag level">${esc(item.level)}</span></div><div class="section"><span class="label">Waarvoor gebruik je het?</span>${esc(item.use)}</div><div class="section"><span class="label">Wanneer gebruik je dit?</span>${esc(item.when)}</div><div class="section"><span class="label">Voorbeeld</span><div class="codeblock">${esc(item.example)}</div></div><div class="section"><span class="label">Voorbeeld van uitvoer</span><div class="codeblock">${esc(item.output)}</div></div><div class="section"><span class="label">Praktijkopdracht</span>${esc(item.task)}</div><div class="section"><span class="label">Tip / let op</span>${esc(item.tip)}</div><div class="mini">student@linux:~$ klaar voor het volgende commando...</div>`}
function renderMenu(cat){const c=data[cat];sidebarTitle.textContent=cat;sidebarIntro.textContent=c.intro;commandList.innerHTML='';c.items.forEach((item,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.className='menu-btn'+(i===0?' active':'');b.innerHTML=`<strong>${esc(item.title)}</strong><br><span>${esc(item.level)} · ${esc(item.safetyLabel)}</span>`;b.onclick=()=>{document.querySelectorAll('.menu-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderTerminal(item,cat)};li.appendChild(b);commandList.appendChild(li)});renderTerminal(c.items[0],cat)}
categorySelect.onchange=()=>renderMenu(categorySelect.value);categorySelect.value='Starten met Linux';renderMenu(categorySelect.value);
</script>
</body>
</html>
