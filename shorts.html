  body{margin:0;background:#111;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;min-height:100vh}

  h1{margin:0 0 7px;font-size:30px;line-height:1.05;color:#fff}
  .intro{margin:0;font-size:14px;line-height:1.35;max-width:620px;color:rgba(255,255,255,.9)}
  label{display:block;font-size:13px;margin:0 0 6px;color:rgba(255,255,255,.92)}
  select{width:100%;padding:11px 12px;border-radius:13px;border:0;background:white;color:#12333a;font-size:15px;font-weight:bold;outline:none;cursor:pointer}
  .main{height:378px;display:grid;grid-template-columns:300px 1fr;gap:18px}
  .info,.video-box{background:rgba(255,255,255,.9);border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,.23)}
  .info{color:#1f2933;padding:18px;position:relative;overflow:hidden}
  .badge{display:inline-block;background:#12333a;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:bold;margin-bottom:12px}
  .info h2{margin:0 0 11px;color:#d2652a;font-size:25px;line-height:1.12}
  .info p{margin:0;font-size:15px;line-height:1.45}
  .hint{position:absolute;left:18px;right:18px;bottom:18px;background:rgba(18,51,58,.08);border-left:5px solid #efa242;border-radius:10px;padding:10px;font-size:13px;line-height:1.35;color:#263238}
  .video-box{padding:12px}
  .video-wrap{width:100%;height:100%;border-radius:14px;overflow:hidden;background:#000;position:relative}
  .video-wrap iframe{width:100%;height:100%;border:0;display:block;background:#000}
  .fallback{display:grid;place-items:center;width:100%;height:100%;color:white;text-align:center;padding:30px;font-size:16px;line-height:1.4}

videos.sort((a,b)=>a.titel.localeCompare(b.titel,"nl",{numeric:true,sensitivity:"base"}));

const select = document.getElementById("videoSelect");
const videoTitel = document.getElementById("videoTitel");
const videoBeschrijving = document.getElementById("videoBeschrijving");
const videoVak = document.getElementById("videoVak");
const counter = document.getElementById("counter");

function vulMenu(){
  videos.forEach((video,index)=>{
    const option = document.createElement("option");
    option.value = index;
    option.textContent = video.titel;
    select.appendChild(option);
  });
}

function toonVideo(){
  const index = Number(select.value || 0);
  const video = videos[index];
  videoTitel.textContent = video.titel;
  videoBeschrijving.textContent = video.beschrijving;
  counter.textContent = "Filmpje " + (index + 1) + " van " + videos.length;
  videoVak.innerHTML = `<iframe src="${video.link}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
}

vulMenu();
toonVideo();
