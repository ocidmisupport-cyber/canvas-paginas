    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background:

  }

  .page {
    width: 1200px;
    height: 500px;
    overflow: hidden;
    position: relative;
    border-radius: 30px;
    background:

  }

  .page::before {
    content: "";
    position: absolute;
    inset: -80px auto auto -80px;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 212, 75, .38), rgba(255, 212, 75, 0) 68%);
  }

  .page::after {
    content: "";
    position: absolute;
    right: -120px;
    bottom: -160px;
    width: 430px;
    height: 430px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 77, 166, .26), rgba(255, 77, 166, 0) 70%);

  .layout {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 18px;
    padding: 18px;

  .sidebar {

    padding: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #ffffff;
    background: rgba(6, 13, 34, .58);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 18px 45px rgba(0,0,0,.24);

  .eyebrow {

    align-self: flex-start;
    padding: 6px 11px;
    border-radius: 999px;
    color: #16163f;
    background: linear-gradient(135deg, #a7f3ff, #ffe47a);

    font-weight: 800;

    margin-bottom: 11px;

  h1 {

    font-size: 31px;
    line-height: 1.02;
    color: #fff;
    text-shadow: 0 8px 20px rgba(0,0,0,.22);

  .intro {

    font-size: 14px;
    line-height: 1.38;

    font-weight: 800;

  select {

    margin-bottom: 16px;
    padding: 13px 14px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.96);
    color: #152045;
    font-size: 15px;
    font-weight: 800;
    outline: none;
    cursor: pointer;
    box-shadow: 0 12px 25px rgba(0,0,0,.18);

  .info-card {
    padding: 17px;
    border-radius: 20px;
    background: rgba(255,255,255,.94);
    color: #18223f;
    border: 1px solid rgba(255,255,255,.45);

    font-size: 24px;
    line-height: 1.08;
  }

  .info-card p {
    margin: 0;
    color: #31405f;
    font-size: 15px;
    line-height: 1.45;

  .video-area {
    display: grid;
    grid-template-rows: 1fr;
    min-width: 0;
    min-height: 0;
  }

  .player-shell {
    position: relative;
    min-height: 0;
    padding: 10px;
    border-radius: 26px;
    background:

    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 18px 45px rgba(0,0,0,.25);
  }

  .player-shell::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 18px;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    z-index: 2;
  }

  .player-inner {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 22px 42px rgba(0,0,0,.34);
  }

  .player-inner iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;

videos.sort((a,b)=>a.titel.localeCompare(b.titel,"nl",{numeric:true,sensitivity:"base"}));

const select = document.getElementById("videoSelect");
const videoTitel = document.getElementById("videoTitel");
const videoBeschrijving = document.getElementById("videoBeschrijving");
const videoVak = document.getElementById("videoVak");
const counter = document.getElementById("counter");

function vulMenu() {
  videos.forEach((video,index)=>{
    const option = document.createElement("option");
    option.value = index;
    option.textContent = video.titel;
    select.appendChild(option);
  });
}

function toonVideo() {
  const index = Number(select.value || 0);
  const video = videos[index];
  videoTitel.textContent = video.titel;
  videoBeschrijving.textContent = video.beschrijving;
  counter.textContent = "Filmpje " + (index + 1) + " van " + videos.length;
  videoVak.innerHTML = `<iframe src="${video.link}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
}

vulMenu();
